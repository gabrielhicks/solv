name: SolvCliRelease

on:
  # Run on demand. Useful for exercising the runner without pushing to main.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/solv/**'
      - '.github/workflows/solv-cli-release.yml'

jobs:
  build:
    runs-on: solv-runner
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: checkout code repository
        uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          # No `cache:` input on purpose. The pnpm store lives on a persistent PVC mounted at
          # /cache on the runner, so GitHub's hosted cache would tar that volume up and upload it
          # after every run, then restore it over itself before the next one.

      # corepack ships with Node and activates the exact pnpm named in package.json's
      # packageManager field. pnpm/action-setup@v6 installed @pnpm/exe instead, a native binary
      # that needs libatomic.so.1, which the runner image does not carry.
      - name: Enable pnpm
        run: corepack enable && corepack prepare --activate

      - name: Install dependencies
        run: pnpm install

      - name: Build and Add Line
        run: npx turbo -F @gabrielhicks/solv build

      - name: Creating .npmrc
        run: |
          cat << EOF > "$HOME/.npmrc"
            //registry.npmjs.org/:_authToken=$NPM_TOKEN
          EOF
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: create and publish versions
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm ci:version
          publish: pnpm ci:publish
          title: 'solv new release'
          commit: 'solv new release'
          createGithubReleases: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Send a Discord/X Notification if a publish happens
        if: steps.changesets.outputs.published == 'true'
        run: |
          pnpm discord:epics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_CHANNEL_ID_JA: ${{ secrets.DISCORD_CHANNEL_ID_JA }}
